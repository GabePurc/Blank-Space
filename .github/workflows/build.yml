name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test BlankSpaceCore
        run: swift test --package-path BlankSpaceCore

      - name: Build app and widgets for simulator
        run: |
          xcodebuild build \
            -project "Blank Space.xcodeproj" \
            -scheme "Blank Space" \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
